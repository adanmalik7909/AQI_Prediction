# ================================================================
#  Feature Pipeline — Hourly Data Collection
# ================================================================
#  WHAT:  Fetches live weather + air quality from Open-Meteo,
#         computes features, and pushes one row to Hopsworks
#         Feature Store every hour.
#
#  SCHEDULE: Every hour, at minute 0 (UTC)
#  MANUAL:   Can also be triggered via "Run workflow" button
# ================================================================

name: Feature Pipeline

on:
  schedule:
    - cron: '0 * * * *'   # Every hour at :00 UTC
  workflow_dispatch:          # Manual "Run workflow" button in Actions tab


# If a run is already in progress, don't start another one
concurrency:
  group: feature-pipeline
  cancel-in-progress: false

jobs:
  collect-features:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Get the code ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python with pip cache ───────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-feature.txt

      # ── 3. Install ONLY what the feature pipeline needs ──────
      #    (lightweight — no tensorflow/xgboost, keeps runs fast)
      - name: Install dependencies
        run: pip install -r requirements-feature.txt

      # ── 4. Run the pipeline ──────────────────────────────────
      #    run_pipeline.py exits non-zero when it produces no rows, so a run
      #    that stores nothing shows up red instead of silently green.
      - name: Run Feature Pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        working-directory: feature_pipeline
        run: python run_pipeline.py


      # ── 5. Job summary (visible in Actions tab) ─────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## Feature Pipeline Run" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Writes:** a rolling 10-day window of hourly rows, upserted" \
               "on (city, unix_time) so a missed run self-heals" >> $GITHUB_STEP_SUMMARY

