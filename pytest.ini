[pytest]
# Registering markers here keeps `--strict-markers` honest and documents intent.
#
# needs_trained_models: the test reads artifacts from trained_models/, which is
#   gitignored and therefore absent on a fresh CI runner until training has run.
#   The training workflow gates on the consistency tests BEFORE training (so a
#   broken pipeline fails in seconds rather than after 20 minutes), and that
#   pre-training step deselects this marker with `-m "not needs_trained_models"`.
#   The full suite runs again after training, where the artifacts do exist.
#
#   Using a marker rather than `-k "not this and not that"` matters: the -k form
#   has to name every artifact-dependent test by hand, and it already missed
#   test_saved_feature_lists_exist, which failed CI. A new test only has to carry
#   the marker to be handled correctly.
markers =
    needs_trained_models: requires trained_models/ artifacts to exist
